name: Rappels de quota (vendredi)

on:
  schedule:
    # 18 h UTC le vendredi = 20 h à Paris en été, 19 h en hiver.
    # Le cron de GitHub ne connaît que l'heure UTC : c'est le seul décalage à accepter.
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      test:
        description: "Essai à blanc : afficher les rappels sans rien envoyer"
        type: boolean
        default: true
      seuil:
        description: "Rappeler en dessous de ce pourcentage du quota"
        default: "100"

permissions:
  contents: write

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rappeler les quotas dans les tickets
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          ORX_RAPPELS_TEST: ${{ inputs.test && '1' || '' }}
          ORX_RAPPELS_SEUIL: ${{ inputs.seuil || '100' }}
        run: python3 scripts/rappels_quota.py

      - name: Retenir qui a déjà été rappelé
        if: ${{ !inputs.test }}
        # Le seul envoi réel à ce jour (04/09) a raté cette étape : le commit
        # local a bien été fait, mais git push a échoué (probablement une
        # collision avec un autre commit automatique) et n'a jamais été retenté.
        # Résultat, data/rappels-seen.json n'a jamais atteint le dépôt : le
        # marqueur anti-doublon ne survit à aucun lancement. On retente donc
        # plusieurs fois avant d'abandonner, comme push.bat le fait déjà côté humain.
        run: |
          git config user.name "oilroxwood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/rappels-seen.json
          git diff --cached --quiet && exit 0
          git commit -m "🤖 Rappels de quota envoyés"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push refusé (tentative $i/5) — nouvel essai dans 5 s"
            sleep 5
          done
          echo "::error::Impossible de publier data/rappels-seen.json après 5 tentatives — les personnes déjà relancées pourraient l'être une seconde fois au prochain lancement."
          exit 1
