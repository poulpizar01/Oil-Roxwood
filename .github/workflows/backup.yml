name: Sauvegarde quotidienne

on:
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 03h00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copier l'état du dépôt dans les sauvegardes
        run: |
          DATE=$(date +%F)
          mkdir -p backups
          if [ -f data/etat.json ]; then
            cp data/etat.json "backups/$DATE.json"
            echo "Sauvegarde du $DATE : $(wc -c < backups/$DATE.json) octets"
          else
            echo "data/etat.json absent — rien à sauvegarder"
          fi
          # Tri par nom (AAAA-MM-JJ.json), pas par date de modification : juste
          # après actions/checkout, tous les fichiers déjà présents ont la même
          # date de modification (celle du checkout), donc "ls -t" ne peut pas
          # les départager de façon fiable et risquerait de garder les 30
          # mauvais fichiers. Le nom, lui, est déjà chronologique.
          ls -1 backups/*.json 2>/dev/null | sort -r | tail -n +31 | xargs -r rm -f

      - name: Commit
        run: |
          git config user.name "oilroxwood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A backups/
          git diff --cached --quiet && exit 0
          git commit -m "💾 Sauvegarde du jour"
          git pull --rebase origin main || true
          git push origin HEAD:main
