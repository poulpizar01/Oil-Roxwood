name: Sauvegarde quotidienne

on:
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 03h00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copier l'état du dépôt dans les sauvegardes
        run: |
          DATE=$(date +%F)
          mkdir -p backups
          if [ -f data/etat.json ]; then
            cp data/etat.json "backups/$DATE.json"
            echo "Sauvegarde du $DATE : $(wc -c < backups/$DATE.json) octets"
          else
            echo "data/etat.json absent — rien à sauvegarder"
          fi
          ls -1t backups/*.json 2>/dev/null | tail -n +31 | xargs -r rm -f

      - name: Commit
        run: |
          git config user.name "oilroxwood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A backups/
          git diff --cached --quiet && exit 0
          git commit -m "💾 Sauvegarde du jour"
          git pull --rebase origin main || true
          git push origin HEAD:main
